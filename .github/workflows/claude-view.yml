name: Publish code-only branch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  filter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and push code-only branch
        run: |
          rm -rf .github
          find . -type f -not -path './.git/*' \( -iname '*.png' -o -iname '*.webp' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.import' -o -iname '*.uid' -o -iname '*.ogg' -o -iname '*.wav' -o -iname '*.mp3' -o -iname '*.ttf' -o -iname '*.otf' \) -delete
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan claude-view
          git add -A
          git commit -m "Code-only snapshot of $GITHUB_SHA"
          git push -f origin claude-view
