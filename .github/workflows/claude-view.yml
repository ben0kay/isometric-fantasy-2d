name: Publish code-only branch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  filter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Strip binaries
        run: |
          rm -rf .github
          find . -path ./.git -prune -o -type f \( \
            -iname '*.png' -o -iname '*.webp' -o -iname '*.jpg' -o -iname '*.jpeg' \
            -o -iname '*.import' -o -iname '*.uid' -o -iname '*.ogg' -o -iname '*.wav' \
            -o -iname '*.mp3' -o -iname '*.ttf' -o -iname '*.otf' \) -delete
      - name: Push code-only branch
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan claude-view
          git add -A
          git commit -m "Code-only snapshot of ${GITHUB_SHA}"
          git push -f origin claude-view
